<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex,notranslate,noai,noimageai">
<title>Bible &amp; Breakfast · Private page</title>
<link rel="icon" href="/app/icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Poppins:wght@600&display=swap">
<style>
  :root { --bg: #FBF8F3; --surface: #FFFFFF; --ink: #1E2329; --muted: #5A554F; --line: #E9E3D9; --accent: #265E80; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11161C; --surface: #19212A; --ink: #EEF2F6; --muted: #B6C0CB; --line: #33404E; --accent: #8EC3EC; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 19px/1.6 "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    padding: 24px max(18px, env(safe-area-inset-right, 0px)) 24px max(18px, env(safe-area-inset-left, 0px)); }
  main { max-width: 26rem; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 1.6rem 1.4rem; text-align: center; display: flex; flex-direction: column; gap: .8rem; align-items: center; }
  img { width: 9rem; height: auto; border-radius: 12px; }
  h1 { margin: 0; font-family: Poppins, "Segoe UI", sans-serif; font-weight: 600; font-size: 1.5rem; line-height: 1.25; }
  p { margin: 0; color: var(--muted); }
  strong { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="/app/logo.webp" width="720" height="405" alt="Bible &amp; Breakfast, Group 3 logo">
  <h1>This page is private</h1>
  <p>It is only for members of <strong>Bible &amp; Breakfast, Group 3</strong>.</p>
  <p>Please ask Lisa for the link.</p>
</main>
</body>
</html>
