<style>
/* Layout: a "contacts" model. Home is a grid of name cards; each person has their own page
   with big request cards and Previous / Next. Yellow always means "new" or "praise". */
:root {
  --sun: #FFD21F;
  --brand-teal: #265E80;
  --bg: #FBF8F3;
  --surface: #FFFFFF;
  --ink: #1E2329;
  --muted: #5A554F;
  --line: #E9E3D9;
  --edge: #878074;
  --new-line: #A67C00;
  --danger: #B3261E;
  --bar-bg: #265E80;
  --bar-ink: #FFFFFF;
  --bar-active-bg: #FFFFFF;
  --bar-active-ink: #265E80;
  --accent: #265E80;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE9F2;
  --praise: #6B5000;
  --praise-soft: #FFF2BF;
  --focus: #C77700;
  --display: "Poppins", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --scale: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161C; --surface: #19212A; --ink: #EEF2F6; --muted: #B6C0CB; --line: #33404E; --edge: #6E8194; --new-line: #FFD21F; --danger: #FF9C92; --bar-bg: #1B3A52; --bar-ink: #FFFFFF; --bar-active-bg: #8EC3EC; --bar-active-ink: #0C1A25;
    --accent: #8EC3EC; --accent-ink: #0C1A25; --accent-soft: #1C3246; --praise: #EFC56A; --praise-soft: #382C12;
    --focus: #F2B544; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161C; --surface: #19212A; --ink: #EEF2F6; --muted: #B6C0CB; --line: #33404E; --edge: #6E8194; --new-line: #FFD21F; --danger: #FF9C92; --bar-bg: #1B3A52; --bar-ink: #FFFFFF; --bar-active-bg: #8EC3EC; --bar-active-ink: #0C1A25;
  --accent: #8EC3EC; --accent-ink: #0C1A25; --accent-soft: #1C3246; --praise: #EFC56A; --praise-soft: #382C12;
  --focus: #F2B544; color-scheme: dark;
}
:root[data-size="2"] { --scale: 1.15; }
:root[data-size="3"] { --scale: 1.32; }
html { font-size: calc(18px * var(--scale)); }
body { background: var(--bg); color: var(--ink); font: 1.1rem/1.6 var(--body); }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
h1:focus, h2:focus { outline: none; }

#app {
  max-width: 46rem; margin: 0 auto;
  padding-block: 1.25rem 8rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 1.25rem;
}

/* shared controls */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  min-height: 56px; padding: .5rem 1.1rem; border-radius: 12px; border: 2px solid var(--edge);
  background: var(--surface); cursor: pointer; font-weight: 700; font-size: 1.05rem; text-decoration: none; text-align: center; line-height: 1.25;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.size { display: flex; align-items: center; gap: .35rem; }
.size-label { font-size: .9rem; color: var(--muted); margin-right: .15rem; }
.size-btn { min-width: 48px; min-height: 48px; border-radius: 10px; border: 2px solid var(--edge); background: var(--surface); cursor: pointer; font-family: var(--display); font-weight: 600; line-height: 1; }
.size-btn.s1 { font-size: 1rem; } .size-btn.s2 { font-size: 1.25rem; } .size-btn.s3 { font-size: 1.5rem; }
.size-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.avatar {
  flex: none; width: 3.4rem; height: 3.4rem; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-family: var(--display); font-weight: 600; font-size: 1.15rem; letter-spacing: .02em;
}
.is-new .avatar { background: var(--sun); color: var(--brand-teal); }
.badge { display: inline-block; background: var(--sun); color: var(--brand-teal); font-weight: 700; font-size: .82rem; padding: .05rem .55rem; border-radius: 999px; }

/* home */
.top { display: flex; flex-direction: column; gap: .9rem; }
.brand { display: flex; align-items: center; gap: .9rem; }
.logo { flex: none; display: block; width: 7.2rem; height: auto; border-radius: 12px; }
.brand-text { min-width: 0; display: flex; flex-direction: column; gap: .1rem; }
.brand-text h1 { font-size: 1.85rem; line-height: 1.15; }
.brand-text p { color: var(--muted); font-size: .95rem; line-height: 1.35; }
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 2px solid var(--new-line); border-radius: 16px; overflow: hidden; }
.row-link { display: flex; align-items: center; gap: .85rem; min-height: 72px; padding: .6rem .9rem .6rem 1rem; text-decoration: none; }
.rows li + li .row-link { border-top: 1px solid var(--line); }
.row-link:hover { background: var(--accent-soft); }
.row-link:focus-visible { outline-offset: -3px; }
.row-link .avatar { width: 2.9rem; height: 2.9rem; font-size: 1rem; background: var(--sun); color: var(--brand-teal); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .05rem; }
.row-name { font-family: var(--display); font-weight: 600; font-size: 1.12rem; line-height: 1.3; }
.row-preview { font-size: 1rem; line-height: 1.4; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.row-more { color: var(--accent); font-weight: 700; font-size: .9rem; }
.chev { flex: none; font-size: 2rem; line-height: 1; color: var(--accent); }
.deck { display: flex; flex-direction: column; gap: .7rem; }
.deck-track { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; border-radius: 16px; }
.deck-track::-webkit-scrollbar { display: none; }
.deck-card { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; background: var(--surface); border: 2px solid var(--sun); border-radius: 16px; padding: 1.1rem 1.2rem 1.2rem; display: flex; flex-direction: column; gap: .7rem; }
.deck-card .today-who h3 { font-size: 1.35rem; line-height: 1.25; }
.deck-card .avatar { width: 3rem; height: 3rem; font-size: 1.05rem; background: var(--sun); color: var(--brand-teal); }
.deck-card ul { margin: 0; padding-left: 1.25rem; display: flex; flex-direction: column; gap: .35rem; }
.deck-card li { font-size: 1.2rem; line-height: 1.45; overflow-wrap: anywhere; }
.deck-card li::marker { color: var(--accent); }
.deck-open { align-self: flex-start; margin-top: auto; min-height: 52px; }
.deck-nav { display: grid; grid-template-columns: 1fr auto 1fr; gap: .6rem; align-items: center; }
.deck-nav .btn { min-height: 60px; font-size: 1.1rem; }

.deck-count { font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.deck-count span { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }
.meter { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .2s; }
.linklike { align-self: flex-start; background: none; border: 0; padding: .4rem .2rem; min-height: 48px; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }
.today-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .7rem; }
.today-card { display: flex; flex-direction: column; gap: .35rem; text-decoration: none; background: var(--surface); border: 2px solid var(--sun); border-radius: 16px; padding: .9rem 1.1rem; }
.today-card:hover { border-color: var(--accent); }
.today-who { display: flex; align-items: center; gap: .7rem; }
.today-who .avatar { width: 2.6rem; height: 2.6rem; font-size: .95rem; background: var(--sun); color: var(--brand-teal); }
.today-who strong { font-family: var(--display); font-weight: 600; font-size: 1.15rem; line-height: 1.25; }
.today-who .go { margin-left: auto; color: var(--accent); font-weight: 700; font-size: .95rem; white-space: nowrap; }
.today-card ul { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: .25rem; }
.today-card li { font-size: 1.12rem; line-height: 1.45; overflow-wrap: anywhere; }
.today-card li::marker { color: var(--accent); }
.title-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .6rem 1rem; }

.updated { color: var(--muted); }
.updated strong { color: var(--ink); }
.sample { border: 2px dashed var(--muted); border-radius: 12px; padding: .65rem 1rem; color: var(--muted); font-size: .95rem; }
.sample strong { color: var(--ink); }
.praise-link {
  display: flex; align-items: center; gap: 1rem; text-decoration: none; min-height: 72px;
  background: var(--praise-soft); border: 2px solid var(--new-line); border-radius: 16px; padding: .9rem 1.1rem;
}
.praise-link .icon { flex: none; width: 2.8rem; height: 2.8rem; border-radius: 50%; background: var(--sun); color: var(--brand-teal); display: grid; place-items: center; }
.praise-link .icon svg { width: 1.5rem; height: 1.5rem; }
.praise-link strong { display: block; font-family: var(--display); font-weight: 600; font-size: 1.2rem; line-height: 1.3; }
.praise-link span.sub { color: var(--muted); font-size: .95rem; }
.praise-link .go { margin-left: auto; font-size: 1.6rem; color: var(--praise); }
.praise-link:hover { border-color: var(--praise); }
.section-title { font-size: 1.3rem; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.filter { min-height: 56px; border-radius: 12px; border: 2px solid var(--edge); background: var(--surface); cursor: pointer; font-weight: 700; font-size: 1rem; padding: .4rem .6rem; line-height: 1.25; }
.filter[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.hint { color: var(--muted); font-size: .95rem; }
.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(8.4rem, 100%), 1fr)); gap: .75rem; }
.tile {
  position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; gap: .45rem;
  padding: .85rem .55rem .75rem; border-radius: 16px; border: 2px solid var(--edge); background: var(--surface); text-decoration: none; min-height: 8.4rem;
}
.tile:hover { border-color: var(--accent); }
.tile.is-new { border-color: var(--new-line); }
.tile .avatar { width: 3rem; height: 3rem; font-size: 1.05rem; }
.tile-name { font-weight: 700; font-size: 1.08rem; line-height: 1.25; overflow-wrap: anywhere; }
.tile-count { color: var(--muted); font-size: .92rem; margin-top: auto; }
.tile .badge { position: absolute; top: .5rem; right: .5rem; }

/* person and praise pages */
.topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .6rem; }
.who { display: flex; align-items: center; gap: 1rem; }
.who .avatar { width: 4.6rem; height: 4.6rem; font-size: 1.5rem; }
.who h1 { font-size: 1.95rem; line-height: 1.15; }
.who p { color: var(--muted); }
.cards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .8rem; }
.req { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1.05rem 1.2rem; display: flex; flex-direction: column; gap: .45rem; }
.req.is-new { border: 2px solid var(--new-line); }
.req.answered { background: var(--praise-soft); border-color: transparent; }
.req-text { font-size: 1.22rem; line-height: 1.5; overflow-wrap: anywhere; }
.req-name { font-family: var(--display); font-weight: 600; font-size: 1.1rem; }
.req-note { font-weight: 700; }
.meta { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; color: var(--muted); font-size: .95rem; }
.answered .meta { color: var(--ink); }
.pager {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 2px solid var(--line);
  padding: .75rem max(16px, env(safe-area-inset-right, 0px)) calc(.75rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.pager-in { max-width: 46rem; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.7fr; gap: .6rem; }
.pager .btn { min-height: 60px; }
.pager .next { flex-direction: column; gap: 0; }
.pager .next small { font-weight: 400; font-size: .85rem; opacity: .9; }
.pager .placeholder { visibility: hidden; }
.foot { border-top: 1px solid var(--line); padding-top: 1rem; color: var(--muted); font-size: .95rem; }
@media (max-width: 380px) { .grid { grid-template-columns: 1fr 1fr; gap: .6rem; } .tile { padding-inline: .4rem; } }

/* main navigation: bottom bar on phones, sidebar on big screens */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
  box-shadow: 0 -2px 12px rgba(0,0,0,.06);
}
.tabbar ul { list-style: none; margin: 0 auto; padding: 0; max-width: 46rem; display: grid; grid-template-columns: repeat(3, 1fr); }
.tabbar-link {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem;
  min-height: 70px; padding: .45rem .25rem .4rem; text-decoration: none; color: var(--muted); font-weight: 700; font-size: .92rem;
  border-top: 4px solid transparent;
}
.tabbar-link:hover { color: var(--accent); }
.tabbar-link[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }
.tab-icon svg { display: block; width: 1.75rem; height: 1.75rem; }
.tab-badge {
  position: absolute; top: .3rem; left: calc(50% + .45rem); min-width: 1.6rem; padding: 0 .4rem; border-radius: 999px;
  background: var(--sun); color: var(--brand-teal); font-size: .8rem; line-height: 1.55; text-align: center; border: 2px solid var(--surface);
}
.wide-btn { width: 100%; min-height: 60px; }
.empty { display: flex; flex-direction: column; align-items: center; gap: .6rem; text-align: center; }
.pager { position: static; background: none; border: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; margin-top: .5rem; }
.pager .pager-in { max-width: none; }
#app { padding-bottom: calc(7rem + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 900px) {
  body { padding-left: 15.5rem; }
  .tabbar {
    top: 0; right: auto; bottom: 0; width: 15.5rem; border-top: 0; border-right: 1px solid var(--line); box-shadow: none;
    padding: max(1.5rem, env(safe-area-inset-top, 0px)) .8rem 1.5rem max(.8rem, env(safe-area-inset-left, 0px));
  }
  .tabbar ul { grid-template-columns: 1fr; gap: .4rem; max-width: none; margin: 0; width: 100%; }
  .tabbar-link { flex-direction: row; justify-content: flex-start; gap: .85rem; min-height: 60px; padding: .5rem 1rem; border-top: 0; border-radius: 12px; font-size: 1.1rem; }
  .tabbar-link[aria-current="page"] { background: var(--accent-soft); }
  .tab-badge { position: static; margin-left: auto; border: 0; }
  #app { padding-bottom: 3rem; }
}

/* sidebar extras, shown on big screens only */
.side-brand, .side-label, .side-foot { display: none; }
@media (min-width: 900px) {
  .tabbar { display: flex; flex-direction: column; gap: 1rem; background: var(--surface); }
  .side-brand { display: flex; flex-direction: column; gap: .7rem; padding: 0 .4rem 1.1rem; border-bottom: 1px solid var(--line); }
  .side-brand img { width: 100%; height: auto; border-radius: 12px; }
  .side-brand strong { display: block; font-family: var(--display); font-weight: 600; font-size: 1.15rem; line-height: 1.25; }
  .side-brand span { display: block; color: var(--muted); font-size: .85rem; line-height: 1.35; }
  .side-label { display: block; margin: 0; padding: 0 .4rem; font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .tabbar-link { position: relative; color: var(--ink); }
  .tabbar-link .tab-icon { flex: none; width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--accent); }
  .tabbar-link .tab-icon svg { width: 1.4rem; height: 1.4rem; }
  .tabbar-link:hover { background: var(--bg); color: var(--ink); }
  .tabbar-link[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
  .tabbar-link[aria-current="page"]::before { content: ""; position: absolute; left: -.8rem; top: .6rem; bottom: .6rem; width: 5px; border-radius: 0 4px 4px 0; background: var(--accent); }
  .tabbar-link[aria-current="page"] .tab-icon { background: var(--accent); color: var(--accent-ink); }

  .side-foot strong { color: var(--ink); }
  .top .logo { display: none; }
}
.skip { position: fixed; z-index: 30; left: max(12px, env(safe-area-inset-left, 0px)); top: -100px; background: var(--surface); color: var(--accent); font-weight: 700; padding: .8rem 1.1rem; border-radius: 10px; border: 2px solid var(--accent); }
.skip:focus { top: calc(env(safe-area-inset-top, 0px) + 12px); }
#app:focus { outline: none; }
/* adding a request */
.composer { display: flex; align-items: center; gap: .9rem; min-height: 76px; padding: .8rem 1rem; text-decoration: none; background: var(--surface); border: 2px solid var(--edge); border-radius: 16px; }
.composer:hover { border-color: var(--accent); }
.composer .plus, .avatar.plus { flex: none; width: 3rem; height: 3rem; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.avatar.plus { width: 4.6rem; height: 4.6rem; }
.composer .plus svg { width: 1.5rem; height: 1.5rem; }
.avatar.plus svg { width: 2.2rem; height: 2.2rem; }
.composer-text strong { display: block; font-family: var(--display); font-weight: 600; font-size: 1.15rem; line-height: 1.3; }
.composer-text span { display: block; color: var(--muted); font-size: .95rem; line-height: 1.35; }
.composer .chev { margin-left: auto; }
.form { display: flex; flex-direction: column; gap: 1.6rem; }
.field { display: flex; flex-direction: column; gap: .45rem; border: 0; margin: 0; padding: 0; min-width: 0; }
.field > label, .field legend { font-weight: 700; font-size: 1.15rem; line-height: 1.35; padding: 0; margin-bottom: .1rem; }
.field .help { color: var(--muted); font-size: .98rem; }
.input { width: 100%; min-height: 60px; padding: .7rem .9rem; border: 2px solid var(--edge); border-radius: 12px; background: var(--surface); color: var(--ink); font: inherit; font-size: 1.12rem; }
textarea.input { min-height: 9rem; line-height: 1.5; resize: vertical; }
.input:focus { border-color: var(--accent); }
.input[aria-invalid="true"] { border-color: var(--danger); }
.choices { display: grid; gap: .65rem; }
